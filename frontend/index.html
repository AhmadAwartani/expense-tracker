<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- this link has an id because app.js changes it to the RTL version when the language is Arabic -->
  <link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- 1. Navbar: always dark, so it stays the same in light mode and dark mode -->
  <nav class="navbar navbar-dark bg-dark border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0 h1" data-i18n="app_name">Expense Tracker</span>
      <div class="d-flex gap-2">
        <div class="dropdown">
          <button type="button" id="languageButton" class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            🌐 <span data-i18n="languages_label">Languages</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageButton">
            <li><button type="button" class="dropdown-item" data-lang="en">English</button></li>
            <li><button type="button" class="dropdown-item" data-lang="ar">العربية</button></li>
          </ul>
        </div>
        <button type="button" id="themeButton" class="btn btn-outline-light btn-sm" data-i18n="theme_dark">Dark mode</button>
      </div>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">

    <!-- alerts (errors and messages) are added here by app.js -->
    <div id="alertBox"></div>

    <!-- 2. Summary cards (they use CSS Grid, see style.css) -->
    <div class="summary-grid mb-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-subtitle mb-2 text-body-secondary" data-i18n="total_amount"></h6>
          <div class="summary-value" id="totalAmount">0.00</div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-subtitle mb-2 text-body-secondary" data-i18n="expense_count"></h6>
          <div class="summary-value" id="expenseCount">0</div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-subtitle mb-2 text-body-secondary" data-i18n="highest_expense"></h6>
          <div class="summary-value" id="highestAmount">0.00</div>
          <small class="text-body-secondary text-truncate d-block" id="highestTitle">-</small>
        </div>
      </div>
    </div>

    <!-- 3. Form to add an expense: now full width, on top -->
    <div class="card shadow-sm mb-4">
      <div class="card-header" data-i18n="add_title"></div>
      <div class="card-body">
        <!-- novalidate: we show our own error messages, not the browser ones -->
        <form id="addForm" novalidate>
          <div class="row g-3">

            <div class="col-md-3">
              <label for="titleInput" class="form-label" data-i18n="label_title"></label>
              <input type="text" id="titleInput" class="form-control" placeholder="For example: Lunch" data-i18n-placeholder="placeholder_title">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-3">
              <label for="amountInput" class="form-label" data-i18n="label_amount"></label>
              <input type="number" id="amountInput" class="form-control" step="0.01" placeholder="0.00" data-i18n-placeholder="placeholder_amount">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-3">
              <label for="categoryInput" class="form-label" data-i18n="label_category"></label>
              <select id="categoryInput" class="form-select">
                <option value="" data-i18n="choose_category"></option>
              </select>
              <div class="invalid-feedback"></div>

              <!-- shown only when the user picks "Other" in the select above -->
              <div id="otherCategoryWrapper" class="mt-2 d-none">
                <label for="otherCategoryInput" class="form-label" data-i18n="label_other_category"></label>
                <input type="text" id="otherCategoryInput" class="form-control" data-i18n-placeholder="placeholder_other_category">
                <div class="invalid-feedback"></div>
              </div>
            </div>

            <div class="col-md-3">
              <label for="dateInput" class="form-label" data-i18n="label_date"></label>
              <input type="date" id="dateInput" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12">
              <button type="submit" id="addButton" class="btn btn-primary w-100" data-i18n="btn_add"></button>
            </div>

          </div>
        </form>
      </div>
    </div>

    <!-- 4 and 5. Filter and table: now full width, under the form card -->
    <div class="card shadow-sm">
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span data-i18n="table_title"></span>
        <div class="d-flex align-items-center gap-2">
          <label for="filterSelect" class="form-label mb-0" data-i18n="filter_label"></label>
          <select id="filterSelect" class="form-select form-select-sm w-auto">
            <option value="" data-i18n="all"></option>
          </select>
        </div>
      </div>

      <!-- spinner: app.js shows it while the data is loading -->
      <div id="spinner" class="text-center p-3 d-none">
        <div class="spinner-border" role="status">
          <span class="visually-hidden" data-i18n="loading"></span>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>
                <button type="button" class="btn btn-link btn-sm p-0 border-0 sort-button" data-column="title">
                  <span data-i18n="th_title"></span>
                  <span class="sort-arrow">▲</span>
                </button>
              </th>
              <th>
                <button type="button" class="btn btn-link btn-sm p-0 border-0 sort-button" data-column="amount">
                  <span data-i18n="th_amount"></span>
                  <span class="sort-arrow">▲</span>
                </button>
              </th>
              <th>
                <button type="button" class="btn btn-link btn-sm p-0 border-0 sort-button" data-column="category">
                  <span data-i18n="th_category"></span>
                  <span class="sort-arrow">▲</span>
                </button>
              </th>
              <th>
                <button type="button" class="btn btn-link btn-sm p-0 border-0 sort-button" data-column="date">
                  <span data-i18n="th_date"></span>
                  <span class="sort-arrow">▲</span>
                </button>
              </th>
              <th data-i18n="th_actions"></th>
            </tr>
          </thead>
          <!-- the rows are built by JavaScript (DOM), not written here -->
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="py-3 text-bg-dark">
    <div class="container text-center small">
      <div class="opacity-75" data-i18n="footer_text"></div>
      <div dir="ltr" data-i18n="footer_text2">&copy; <span id="year"></span></div>
    </div>
  </footer>

  <!-- Edit modal (Bootstrap) -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="edit_title"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <!-- errors of the edit are shown here, because the alert of the page is behind the modal -->
            <div id="editAlertBox"></div>

            <div class="mb-3">
              <label for="editTitleInput" class="form-label" data-i18n="label_title">Title</label>
              <input type="text" id="editTitleInput" class="form-control">
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="editAmountInput" class="form-label" data-i18n="label_amount"></label>
              <input type="number" id="editAmountInput" class="form-control" step="0.01">
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="editCategoryInput" class="form-label" data-i18n="label_category"></label>
              <select id="editCategoryInput" class="form-select">
                <option value="" data-i18n="choose_category"></option>
              </select>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label for="editDateInput" class="form-label" data-i18n="label_date">Date</label>
              <input type="date" id="editDateInput" class="form-control">
              <div class="invalid-feedback"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_cancel">Cancel</button>
            <button type="submit" id="saveButton" class="btn btn-primary" data-i18n="btn_save">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
